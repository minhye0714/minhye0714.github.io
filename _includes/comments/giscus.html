<!-- Keep the embedded comments in sync with the blog's color mode. -->
{% include comments/anonymous.html %}
<script>
  (function () {
    const themeMap = Theme.newThemeMap(
      new URL({{ '/assets/css/giscus-light.css' | relative_url | jsonify }}, window.location.origin).href,
      new URL({{ '/assets/css/giscus-dark.css' | relative_url | jsonify }}, window.location.origin).href
    );
    const composerThemeMap = Theme.newThemeMap(
      new URL({{ '/assets/css/giscus-composer-light.css' | relative_url | jsonify }}, window.location.origin).href,
      new URL({{ '/assets/css/giscus-composer-dark.css' | relative_url | jsonify }}, window.location.origin).href
    );

    let lang = {{ site.comments.giscus.lang | default: lang | jsonify }};
    if (lang.length > 2 && !lang.startsWith('zh')) {
      lang = lang.slice(0, 2);
    }

    const attributes = {
      src: 'https://giscus.app/client.js',
      'data-repo': {{ site.comments.giscus.repo | jsonify }},
      'data-repo-id': {{ site.comments.giscus.repo_id | jsonify }},
      'data-category': {{ site.comments.giscus.category | jsonify }},
      'data-category-id': {{ site.comments.giscus.category_id | jsonify }},
      'data-mapping': {{ site.comments.giscus.mapping | default: 'pathname' | jsonify }},
      'data-strict': {{ site.comments.giscus.strict | default: '0' | jsonify }},
      'data-reactions-enabled': {{ site.comments.giscus.reactions_enabled | default: '1' | jsonify }},
      'data-emit-metadata': '1',
      'data-theme': themeMap[Theme.resolvedTheme],
      'data-input-position': {{ site.comments.giscus.input_position | default: 'bottom' | jsonify }},
      'data-lang': lang,
      'data-loading': 'lazy',
      crossorigin: 'anonymous',
      async: ''
    };

    const section = document.createElement('section');
    section.className = 'post-comments';
    section.setAttribute('aria-label', '댓글');
    const anchor = document.getElementById('post-comments-anchor');
    if (anchor) anchor.replaceWith(section);
    else document.querySelector('#tail-wrapper footer').insertAdjacentElement('beforebegin', section);

    const title = document.createElement('h2');
    title.className = 'anonymous-comment-sr-only';
    title.textContent = '댓글';
    section.appendChild(title);

    const githubContainer = document.createElement('div');
    githubContainer.className = 'github-comments';
    githubContainer.setAttribute('aria-label', 'GitHub 댓글');
    const composerHeading = document.createElement('h3');
    // The visible title is inside the iframe, below its post reactions.
    composerHeading.className = 'comment-composer-heading anonymous-comment-sr-only';
    composerHeading.textContent = 'GitHub으로 댓글 남기기';
    section.appendChild(composerHeading);
    const returnButton = document.createElement('button');
    returnButton.type = 'button';
    returnButton.className = 'comment-thread-return';
    returnButton.textContent = '← 전체 댓글로 돌아가기';
    returnButton.hidden = true;
    section.appendChild(returnButton);
    section.appendChild(githubContainer);

    const anonymousTemplate = document.getElementById('anonymous-comments-template');
    if (anonymousTemplate) {
      section.appendChild(anonymousTemplate.content.cloneNode(true));
    }

    const script = document.createElement('script');
    Object.entries(attributes).forEach(([key, value]) => script.setAttribute(key, value));
    githubContainer.appendChild(script);

    let sharedReady = false;
    let threadMode = false;
    let lastMetadata;

    function updateViewer(login) {
      const viewer = typeof login === 'string' && login.length <= 100 ? login : '';
      if (section.dataset.githubViewer === viewer) return;
      section.dataset.githubViewer = viewer;
      section.dispatchEvent(new CustomEvent('comments:giscus-auth'));
    }

    function syncTheme() {
      const map = sharedReady && !threadMode ? composerThemeMap : themeMap;
      const theme = map[Theme.resolvedTheme];
      const iframe = section.querySelector('.giscus-frame');
      if (!iframe) return;
      if (iframe.classList.contains('giscus-frame--loading')) {
        const url = new URL(iframe.src);
        if (url.searchParams.get('theme') !== theme) {
          url.searchParams.set('theme', theme);
          iframe.src = url.toString();
        }
      }
      iframe.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, 'https://giscus.app');
    }

    function setThreadMode(value) {
      threadMode = value;
      section.querySelector('.anonymous-comments').hidden = value;
      composerHeading.textContent = value ? 'GitHub 답글·반응' : 'GitHub으로 댓글 남기기';
      returnButton.hidden = !value;
      syncTheme();
    }

    section.addEventListener('comments:ready', () => {
      sharedReady = true;
      syncTheme();
    });
    section.addEventListener('comments:github-thread', () => {
      setThreadMode(true);
      returnButton.focus();
      githubContainer.scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
    returnButton.addEventListener('click', () => {
      setThreadMode(false);
      section.dispatchEvent(new CustomEvent('comments:refresh'));
      section.querySelector('.comment-list-heading h3').focus();
    });
    const observer = new MutationObserver(() => {
      if (section.querySelector('.giscus-frame')) {
        syncTheme();
        observer.disconnect();
      }
    });
    observer.observe(githubContainer, { childList: true, subtree: true });

    addEventListener('message', (event) => {
      const iframe = section.querySelector('.giscus-frame');
      if (event.origin === 'https://giscus.app' && event.source === iframe?.contentWindow) {
        const giscus = event.data?.giscus;
        if (giscus?.signOut || /Bad credentials|Invalid state value|State has expired/.test(giscus?.error || '')) {
          updateViewer('');
        } else if (giscus && Object.hasOwn(giscus, 'viewer')) {
          updateViewer(giscus.viewer?.login);
        }
        const discussionUrl = event.data?.giscus?.discussion?.url;
        const prefix = `https://github.com/${attributes['data-repo']}/discussions/`;
        if (typeof discussionUrl === 'string' && discussionUrl.startsWith(prefix)) {
          const discussion = event.data.giscus.discussion;
          const metadata = JSON.stringify([discussionUrl, discussion.totalCommentCount, discussion.totalReplyCount, discussion.reactionCount]);
          if (metadata !== lastMetadata) {
            lastMetadata = metadata;
            section.dispatchEvent(new CustomEvent('comments:giscus-updated'));
          }
        }
        return;
      }

      if (event.source !== window || !event.data || event.data.id !== Theme.eventId) {
        return;
      }

      syncTheme();
    });
  })();
</script>
